[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cofre"
version = "0.1.0"
description = "Gerenciador de senhas local e criptografado para Windows e Linux"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50",
    "PySide6-Essentials>=6.12",
]

[project.gui-scripts]
cofre = "cofre.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
